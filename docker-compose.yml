services:
  auth-service:
    build: ./services/auth-service
    environment:
      SHARED_SECRET: ${SHARED_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/marketly
      CORS_ALLOWED_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  catalog-service:
    build: ./services/catalog-service
    environment:
      SHARED_SECRET: ${SHARED_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/marketly
      CORS_ALLOWED_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  orders-service:
    build: ./services/orders-service
    environment:
      SHARED_SECRET: ${SHARED_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/marketly
      CATALOG_SERVICE_URL: http://catalog-service:5002
      CORS_ALLOWED_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks: [app]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - catalog-service
      - orders-service
    networks: [app]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marketly
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d marketly"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

volumes:
  pg-data:

networks:
  app:
