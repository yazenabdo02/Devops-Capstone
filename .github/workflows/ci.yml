name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, catalog-service, orders-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Compile check
        run: python -m py_compile services/${{ matrix.service }}/app.py services/${{ matrix.service }}/db.py

      - name: Health endpoint smoke test
        working-directory: services/${{ matrix.service }}
        run: |
          python - <<'EOF'
          import app
          client = app.app.test_client()
          resp = client.get("/health")
          assert resp.status_code == 200, resp.status_code
          assert resp.get_json()["status"] == "ok"
          print("health OK")
          EOF

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service, context: services/auth-service }
          - { name: catalog-service, context: services/catalog-service }
          - { name: orders-service, context: services/orders-service }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --provenance=false -t local/${{ matrix.name }}:ci ${{ matrix.context }}

      - name: Configure AWS credentials (OIDC, no static keys)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/capstone/${{ matrix.name }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag local/${{ matrix.name }}:ci "$REPO:$SHORT_SHA"
          docker tag local/${{ matrix.name }}:ci "$REPO:latest"
          docker push "$REPO:$SHORT_SHA"
          docker push "$REPO:latest"